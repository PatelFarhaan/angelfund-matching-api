image: python:3.7.3

pipelines:
  default:
    - step:
        name: Build
        caches:
          - pip
        script:
          - pip3 install -r requirements.txt
          - apt-get update
          - apt-get install -y zip
          - zip -r application1.zip .
        artifacts:
          - application1.zip
    - step:
        name: Uploading to S3
        caches:
          - pip
        script:
          - pipe: atlassian/aws-code-deploy:0.5.3
            variables:
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_ACCESS_SECRET_KEY_ID
              APPLICATION_NAME: $APPLICATION_NAME
              S3_BUCKET: $S3_BUCKET
              COMMAND: 'upload'
              ZIP_FILE: 'application1.zip'
              VERSION_LABEL: 'my-app-1.0.0'
    - step:
        name: Deploying on Test Server
        caches:
          - pip
        script:
          - pipe: atlassian/aws-code-deploy:0.5.3
            variables:
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY: $AWS_ACCESS_SECRET_KEY_ID
              APPLICATION_NAME: $APPLICATION_NAME
              DEPLOYMENT_GROUP: $DEPLOYMENT_GROUP_NAME
              S3_BUCKET: $S3_BUCKET
              COMMAND: 'deploy'
              WAIT: 'true'
              VERSION_LABEL: 'my-app-1.0.0'
              IGNORE_APPLICATION_STOP_FAILURES: 'true'
              FILE_EXISTS_BEHAVIOR: 'OVERWRITE'